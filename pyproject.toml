[project]
name = "worklog-timesheet-register"
version = "0.1.0"
description = "Publish timesheet spreadsheet entries as Artia time entries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "typer>=0.12.0",
]

[project.scripts]
apontar = "worklog.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.hatch.build.targets.wheel]
packages = ["worklog"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
